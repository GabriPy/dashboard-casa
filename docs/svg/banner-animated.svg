<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Ghibiri Home</title>
  <desc id="d">La casa di famiglia, organizzata. Una casa con sei finestre che si accendono in sequenza: calendario, spesa, scadenze, ricette, piante e famiglia.</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans  { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* le finestre si accendono una dopo l'altra, restano accese, poi si spengono nello stesso ordine */
    .lit { animation: glow 10s ease-in-out infinite backwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: .7s; }
    .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.5s; }
    .l5 { animation-delay: 1.9s; }
    .l6 { animation-delay: 2.3s; }
    @keyframes glow {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      86%  { opacity: 1; }
      93%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* fumo dal camino */
    .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; animation: puff 4s ease-out infinite; }
    .s2 { animation-delay: 1.3s; }
    .s3 { animation-delay: 2.6s; }
    @keyframes puff {
      0%   { opacity: 0;   transform: translate(0, 0) scale(.6); }
      20%  { opacity: .75; }
      100% { opacity: 0;   transform: translate(16px, -56px) scale(1.5); }
    }

    /* cuore: doppio battito */
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
    @keyframes beat {
      0%, 60%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      40% { transform: scale(1.12); }
    }

    /* vapore dalla pentola */
    .steam { animation: steam 2.4s ease-in-out infinite; }
    .st2 { animation-delay: 1.2s; }
    @keyframes steam {
      0%, 100% { opacity: .25; transform: translateY(3px); }
      50%      { opacity: 1;   transform: translateY(-2px); }
    }

    /* pianta che ondeggia */
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }
    @keyframes sway {
      from { transform: rotate(-4deg); }
      to   { transform: rotate(4deg); }
    }

    /* giorno di oggi sul calendario */
    .tick { animation: tick 2s ease-in-out infinite; }
    @keyframes tick {
      0%, 100% { opacity: .2; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lit, .smoke, .beat, .steam, .sway, .tick { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="c"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <!-- sfondo e prato -->
    <rect width="1280" height="400" fill="#E4ECDF"/>
    <rect y="360" width="1280" height="40" fill="#D3E0CA"/>

    <!-- testo -->
    <text class="serif" x="72" y="150" font-size="88" font-weight="700" fill="#1E3B35" letter-spacing="-1.5">Ghibiri Home</text>
    <text class="serif" x="74" y="206" font-size="34" font-style="italic" fill="#2F4F63">La casa di famiglia, organizzata.</text>
    <text class="sans" x="74" y="254" font-size="21" fill="#3A5A52">Calendario, spesa, scadenze, ricette e piante</text>
    <text class="sans" x="74" y="282" font-size="21" fill="#3A5A52">in un posto solo, privato e pensato per il telefono.</text>

    <!-- tecnologie -->
    <g class="sans" font-size="15" font-weight="600" fill="#1E3B35" text-anchor="middle">
      <rect x="74" y="312" width="128" height="34" rx="17" fill="none" stroke="#1E3B35" stroke-opacity=".4" stroke-width="1.5"/>
      <text x="138" y="334.5">Self-hosted</text>
      <rect x="214" y="312" width="92" height="34" rx="17" fill="none" stroke="#1E3B35" stroke-opacity=".4" stroke-width="1.5"/>
      <text x="260" y="334.5">Docker</text>
      <rect x="318" y="312" width="72" height="34" rx="17" fill="none" stroke="#1E3B35" stroke-opacity=".4" stroke-width="1.5"/>
      <text x="354" y="334.5">PWA</text>
      <rect x="402" y="312" width="156" height="34" rx="17" fill="none" stroke="#1E3B35" stroke-opacity=".4" stroke-width="1.5"/>
      <text x="480" y="334.5">Vue 3 + SQLite</text>
    </g>

    <!-- la casa -->
    <g transform="translate(30 0)">
      <!-- cespugli -->
      <ellipse cx="800" cy="360" rx="36" ry="26" fill="#3F7A58"/>
      <ellipse cx="1120" cy="360" rx="36" ry="26" fill="#3F7A58"/>

      <!-- fumo (dietro il camino) -->
      <g fill="#B7C7BD">
        <circle class="smoke s1" cx="1055" cy="78" r="7"/>
        <circle class="smoke s2" cx="1055" cy="78" r="7"/>
        <circle class="smoke s3" cx="1055" cy="78" r="7"/>
      </g>

      <!-- camino, tetto, facciata -->
      <rect x="1040" y="84" width="30" height="76" fill="#3A5A52"/>
      <polygon points="775,184 960,56 1145,184" fill="#2F4F63"/>
      <rect x="800" y="184" width="320" height="176" fill="#1E3B35"/>

      <!-- porta -->
      <path d="M932 360 V304 a28 28 0 0 1 56 0 V360 Z" fill="#12261F"/>
      <circle cx="977" cy="336" r="3" fill="#FFE7A3"/>

      <!-- finestre: base spenta -->
      <g fill="#29493F" stroke="#F3F7EE" stroke-width="4">
        <rect x="824" y="196" width="64" height="60" rx="6"/>
        <rect x="928" y="196" width="64" height="60" rx="6"/>
        <rect x="1032" y="196" width="64" height="60" rx="6"/>
        <rect x="824" y="284" width="64" height="60" rx="6"/>
        <rect x="1032" y="284" width="64" height="60" rx="6"/>
        <circle cx="960" cy="128" r="23"/>
      </g>
      <!-- davanzali -->
      <g fill="#F3F7EE">
        <rect x="820" y="256" width="72" height="6" rx="2"/>
        <rect x="924" y="256" width="72" height="6" rx="2"/>
        <rect x="1028" y="256" width="72" height="6" rx="2"/>
        <rect x="820" y="344" width="72" height="6" rx="2"/>
        <rect x="1028" y="344" width="72" height="6" rx="2"/>
      </g>

      <!-- Calendario -->
      <g class="lit l1">
        <rect x="824" y="196" width="64" height="60" rx="6" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(856 227)" fill="none" stroke="#2F6FA3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="-15" y="-13" width="30" height="28" rx="4"/>
          <path d="M-15 -4 H15 M-7 -17 V-10 M7 -17 V-10"/>
          <path d="M-7 3 h.1 M0 3 h.1 M7 3 h.1 M-7 9 h.1 M0 9 h.1"/>
          <circle class="tick" cx="7" cy="9" r="2.5" fill="#2F6FA3" stroke="none"/>
        </g>
      </g>

      <!-- Spesa -->
      <g class="lit l2">
        <rect x="928" y="196" width="64" height="60" rx="6" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(960 227)" fill="none" stroke="#7A4FA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-16 -2 H16 L12 14 H-12 Z"/>
          <path d="M-9 -2 L-4 -13 M9 -2 L4 -13"/>
          <path d="M-4 4 V10 M4 4 V10"/>
        </g>
      </g>

      <!-- Scadenze -->
      <g class="lit l3">
        <rect x="1032" y="196" width="64" height="60" rx="6" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(1064 226)" fill="none" stroke="#C93D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle r="14"/>
          <path d="M0 0 L5 3"/>
          <path d="M0 0 V-9">
            <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>

      <!-- Ricette -->
      <g class="lit l4">
        <rect x="824" y="284" width="64" height="60" rx="6" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(856 318)" fill="none" stroke="#C26F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-13 -2 H13 V8 a5 5 0 0 1 -5 5 H-8 a5 5 0 0 1 -5 -5 Z"/>
          <path d="M-13 2 H-18 M13 2 H18"/>
          <path class="steam" d="M-5 -7 q-3 -4 0 -8"/>
          <path class="steam st2" d="M5 -7 q-3 -4 0 -8"/>
        </g>
      </g>

      <!-- Piante -->
      <g class="lit l5">
        <rect x="1032" y="284" width="64" height="60" rx="6" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(1064 316)" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-9 5 H9 L7 15 H-7 Z"/>
          <g class="sway">
            <path d="M0 5 V-10"/>
            <path d="M0 -1 C-9 -1 -12 -8 -12 -12 C-5 -11 0 -7 0 -1 Z"/>
            <path d="M0 -7 C8 -7 11 -13 11 -17 C5 -16 0 -12 0 -7 Z"/>
          </g>
        </g>
      </g>

      <!-- Famiglia -->
      <g class="lit l6">
        <circle cx="960" cy="128" r="23" fill="#FFE7A3" stroke="#F3F7EE" stroke-width="4"/>
        <g transform="translate(960 130) scale(.85)">
          <path class="beat" d="M0 12 C-18 -2 -14 -16 -6 -16 C-3 -16 0 -13 0 -10 C0 -13 3 -16 6 -16 C14 -16 18 -2 0 12 Z" fill="#D05A8A"/>
        </g>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
